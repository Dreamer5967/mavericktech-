<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEGIS-EVC Emergency Green Corridor — Live Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #header { text-align: center; padding: 10px; background: linear-gradient(135deg, #161b22, #1a1e2e); border-bottom: 1px solid #30363d; }
  #header h1 { font-size: 1.3em; color: #58a6ff; letter-spacing: 1px; }
  #header p { font-size: 0.75em; color: #8b949e; margin-top: 2px; }
  #simCanvas { display: block; margin: 0 auto; background: #111; }
  #controls { text-align: center; padding: 10px; background: #161b22; border-top: 1px solid #30363d; }
  #controls button { padding: 8px 20px; margin: 0 5px; border: 1px solid #30363d; border-radius: 6px;
    background: #21262d; color: #c9d1d9; font-size: 0.85em; cursor: pointer; transition: all 0.2s; }
  #controls button:hover { background: #30363d; border-color: #58a6ff; }
  #controls button.active { background: #1f6feb; border-color: #58a6ff; color: white; }
  #status { font-size: 0.75em; color: #8b949e; margin-top: 6px; font-family: 'Consolas', monospace; }
  #legend { display: flex; justify-content: center; gap: 18px; padding: 6px; font-size: 0.7em; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
</style>
</head>
<body>
<div id="header">
  <h1>🚑 AEGIS-EVC — Emergency Green Corridor Simulation</h1>
  <p>Predictive Queue Flushing · V2X Communication · Zero-Stop Green Wave</p>
</div>
<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#ff2222"></div>Ambulance</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4488cc"></div>Queued Cars</div>
  <div class="legend-item"><div class="legend-dot" style="background:#66bb66"></div>Clearing Cars</div>
  <div class="legend-item"><div class="legend-dot" style="background:#33ff33"></div>Green Corridor</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffcc00"></div>Flushing</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff3333"></div>Red / Normal</div>
</div>
<canvas id="simCanvas"></canvas>
<div id="controls">
  <button id="btnStart" class="active" onclick="startSim()">▶ Start</button>
  <button id="btnPause" onclick="pauseSim()">⏸ Pause</button>
  <button id="btnReset" onclick="resetSim()">↺ Reset</button>
  <button id="btnSpeed1" class="active" onclick="setSpeed(1)">1×</button>
  <button id="btnSpeed2" onclick="setSpeed(2)">2×</button>
  <button id="btnSpeed05" onclick="setSpeed(0.5)">0.5×</button>
  <div id="status">Ready — Press Start</div>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

// Responsive canvas
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 160;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); });

// ── Configuration ──
const ROAD_Y_FRAC = 0.50;  // road center as fraction of canvas height
const NUM_JUNCTIONS = 4;
const JUNCTION_SPACING_FRAC = 0.2; // fraction of canvas width between junctions
const CARS_PER_JUNCTION = 5;
const PREDICTION_HORIZON_FRAC = 0.12;
const FLUSH_FRAMES = 40;

let speed = 1;
let running = false;
let frame = 0;
let animId = null;

// ── State ──
class Car {
  constructor(x, y) { this.x = x; this.y = y; this.clearing = false; this.gone = false; this.vy = 0; this.vx = 0; }
}

class Junction {
  constructor(x, idx) {
    this.x = x; this.idx = idx;
    this.state = 'red'; // red, flushing, green, recovering
    this.flushCounter = 0;
    this.cars = [];
    for (let i = 0; i < CARS_PER_JUNCTION; i++) {
      const carW = canvas.width * 0.025;
      const cx = x - carW * 1.3 * (i + 1);
      const cy = ROAD_Y_FRAC * canvas.height + canvas.height * 0.02;
      this.cars.push(new Car(cx, cy));
    }
  }
  get signalColor() {
    if (this.state === 'red') return '#ff3333';
    if (this.state === 'flushing') return '#ffcc00';
    if (this.state === 'green') return '#33ff33';
    return '#ff3333';
  }
}

let amb = { x: -canvas.width * 0.08, y: 0, speed: canvas.width * 0.0025, active: true, passed: new Set() };
let junctions = [];

function initState() {
  const roadY = canvas.height * ROAD_Y_FRAC;
  amb = { x: -canvas.width * 0.08, y: roadY - canvas.height * 0.015, speed: canvas.width * 0.0025, active: true, passed: new Set() };
  junctions = [];
  for (let i = 0; i < NUM_JUNCTIONS; i++) {
    const jx = canvas.width * (0.15 + i * JUNCTION_SPACING_FRAC);
    junctions.push(new Junction(jx, i));
  }
  frame = 0;
}
initState();

// ── Update ──
function update() {
  if (!amb.active) return;
  amb.x += amb.speed * speed;
  if (amb.x > canvas.width * 1.1) amb.active = false;

  const horizon = canvas.width * PREDICTION_HORIZON_FRAC;

  for (const j of junctions) {
    const dist = j.x - amb.x;

    if (j.state === 'red' && dist > 0 && dist < horizon + canvas.width * 0.05) {
      j.state = 'flushing';
      j.flushCounter = 0;
      for (const c of j.cars) c.clearing = true;
    }

    if (j.state === 'flushing') {
      j.flushCounter++;
      for (const c of j.cars) {
        if (!c.gone) {
          // Cars move upward (clear to cross-street) with some randomness
          if (c.vy === 0) {
            c.vy = (1.5 + Math.random()) * speed;
            c.vx = (0.3 + Math.random() * 0.5) * speed;
          }
          c.y -= c.vy;
          c.x += c.vx;
          if (c.y < canvas.height * (ROAD_Y_FRAC - 0.15)) c.gone = true;
        }
      }
      if (j.flushCounter >= FLUSH_FRAMES / speed) j.state = 'green';
    }

    if (j.state === 'green' && amb.x > j.x + canvas.width * 0.04) {
      j.state = 'recovering';
      j.flushCounter = 0;
      amb.passed.add(j.idx);
    }

    if (j.state === 'recovering') {
      j.flushCounter++;
      if (j.flushCounter > 30) j.state = 'red';
    }
  }
  frame++;
}

// ── Draw ──
function draw() {
  const W = canvas.width, H = canvas.height;
  const roadY = H * ROAD_Y_FRAC;
  const roadH = H * 0.12;

  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // Grass
  ctx.fillStyle = '#1a3a18';
  ctx.fillRect(0, 0, W, roadY - roadH / 2);
  ctx.fillStyle = '#1a3a18';
  ctx.fillRect(0, roadY + roadH / 2, W, H);

  // Road
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(0, roadY - roadH / 2, W, roadH);

  // Road edges
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, roadY - roadH / 2); ctx.lineTo(W, roadY - roadH / 2);
  ctx.moveTo(0, roadY + roadH / 2); ctx.lineTo(W, roadY + roadH / 2);
  ctx.stroke();

  // Center dashes
  ctx.strokeStyle = '#ffdd44';
  ctx.lineWidth = 2;
  ctx.setLineDash([W * 0.015, W * 0.01]);
  ctx.beginPath();
  ctx.moveTo(0, roadY); ctx.lineTo(W, roadY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Prediction zone
  if (amb.active && amb.x < junctions[NUM_JUNCTIONS - 1].x + W * 0.05) {
    const horizon = W * PREDICTION_HORIZON_FRAC;
    const zoneL = amb.x + W * 0.03;
    const zoneR = amb.x + horizon + W * 0.03;
    ctx.fillStyle = 'rgba(255, 170, 0, 0.06)';
    ctx.fillRect(zoneL, roadY - roadH / 2, zoneR - zoneL, roadH);
    ctx.strokeStyle = 'rgba(255, 170, 0, 0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(zoneR, roadY - roadH / 2); ctx.lineTo(zoneR, roadY + roadH / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255, 170, 0, 0.6)';
    ctx.font = `${W * 0.008}px Consolas`;
    ctx.textAlign = 'center';
    ctx.fillText('PREDICTION HORIZON', (zoneL + zoneR) / 2, roadY - roadH / 2 - 5);
  }

  // Cross streets & junctions
  for (const j of junctions) {
    // Cross street
    ctx.fillStyle = '#222';
    const crossW = W * 0.02;
    ctx.fillRect(j.x - crossW / 2, 0, crossW, H);

    // Crosswalk stripes
    ctx.fillStyle = '#444';
    for (let s = 0; s < 5; s++) {
      ctx.fillRect(j.x - crossW / 2 + s * crossW / 5, roadY - roadH / 2 - 3, crossW / 10, 6);
      ctx.fillRect(j.x - crossW / 2 + s * crossW / 5, roadY + roadH / 2 - 3, crossW / 10, 6);
    }

    // Signal light
    const sigX = j.x, sigY = roadY - roadH / 2 - H * 0.05;
    // pole
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sigX, roadY - roadH / 2);
    ctx.lineTo(sigX, sigY);
    ctx.stroke();
    // light housing
    ctx.fillStyle = '#1a1a1a';
    const lightR = W * 0.01;
    ctx.fillRect(sigX - lightR * 1.2, sigY - lightR * 1.5, lightR * 2.4, lightR * 3);
    // light
    ctx.beginPath();
    ctx.arc(sigX, sigY, lightR, 0, Math.PI * 2);
    ctx.fillStyle = j.signalColor;
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // glow
    ctx.beginPath();
    ctx.arc(sigX, sigY, lightR * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = j.signalColor.replace(')', ', 0.12)').replace('rgb', 'rgba');
    ctx.fill();

    // Junction label
    ctx.fillStyle = '#8b949e';
    ctx.font = `bold ${W * 0.01}px Consolas`;
    ctx.textAlign = 'center';
    ctx.fillText(`J${j.idx + 1}`, j.x, sigY - lightR * 2);

    // State label
    ctx.fillStyle = j.signalColor;
    ctx.font = `${W * 0.007}px Consolas`;
    ctx.fillText(j.state.toUpperCase(), j.x, roadY + roadH / 2 + 18);

    // Cars
    const carW = W * 0.022, carH = H * 0.03;
    for (const c of j.cars) {
      if (c.gone) continue;
      ctx.fillStyle = c.clearing ? '#66bb66' : '#4488cc';
      roundRect(ctx, c.x - carW / 2, c.y - carH / 2, carW, carH, 3);
      ctx.fill();
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.stroke();
      // windshield
      ctx.fillStyle = 'rgba(100,200,255,0.3)';
      ctx.fillRect(c.x + carW * 0.15, c.y - carH * 0.35, carW * 0.25, carH * 0.7);
    }
  }

  // Ambulance
  if (amb.active) {
    const aW = W * 0.04, aH = H * 0.04;
    // shadow
    ctx.fillStyle = 'rgba(255,0,0,0.15)';
    ctx.fillRect(amb.x - aW / 2 + 3, amb.y - aH / 2 + 3, aW, aH);
    // body
    ctx.fillStyle = '#dd1111';
    roundRect(ctx, amb.x - aW / 2, amb.y - aH / 2, aW, aH, 5);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // white cross
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(amb.x - aW * 0.15, amb.y);
    ctx.lineTo(amb.x + aW * 0.15, amb.y);
    ctx.moveTo(amb.x, amb.y - aH * 0.3);
    ctx.lineTo(amb.x, amb.y + aH * 0.3);
    ctx.stroke();
    // siren flash
    const flash = (frame % 6 < 3) ? '#3399ff' : '#ff3333';
    ctx.beginPath();
    ctx.arc(amb.x + aW * 0.35, amb.y - aH * 0.5, W * 0.005, 0, Math.PI * 2);
    ctx.fillStyle = flash;
    ctx.fill();
    // siren glow
    ctx.beginPath();
    ctx.arc(amb.x + aW * 0.35, amb.y - aH * 0.5, W * 0.015, 0, Math.PI * 2);
    ctx.fillStyle = flash.replace(')', ', 0.2)').replace('#', 'rgba(').replace(/([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/, (m,r,g,b) => `${parseInt(r,16)},${parseInt(g,16)},${parseInt(b,16)}`);
    // simplify the glow
    ctx.fillStyle = (frame % 6 < 3) ? 'rgba(51,153,255,0.2)' : 'rgba(255,51,51,0.2)';
    ctx.fill();

    // V2X radio waves
    if (frame % 10 < 5) {
      ctx.strokeStyle = 'rgba(88,166,255,0.3)';
      ctx.lineWidth = 1;
      for (let r = 1; r <= 3; r++) {
        ctx.beginPath();
        ctx.arc(amb.x + aW * 0.4, amb.y - aH * 0.5, W * 0.01 * r, -0.5, 0.5);
        ctx.stroke();
      }
    }
  }

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, H - 35, W, 35);
  ctx.fillStyle = '#8b949e';
  ctx.font = `${W * 0.009}px Consolas`;
  ctx.textAlign = 'left';

  let statusText;
  if (!amb.active) {
    statusText = `Frame ${frame} | ✅ CORRIDOR CLEARED — Zero-stop passage achieved! | Junctions passed: ${amb.passed.size}/${NUM_JUNCTIONS}`;
  } else {
    let nextJ = junctions.find(j => j.x > amb.x);
    let eta = nextJ ? ((nextJ.x - amb.x) / (amb.speed * speed)).toFixed(0) : '—';
    statusText = `Frame ${frame} | Amb X: ${amb.x.toFixed(0)}px | Speed: ${(speed)}× | ETA next junction: ${eta} frames | Passed: ${amb.passed.size}/${NUM_JUNCTIONS}`;
  }
  ctx.fillText(statusText, 15, H - 12);

  // Stage annotations
  ctx.textAlign = 'right';
  ctx.fillStyle = '#58a6ff';
  ctx.font = `bold ${W * 0.01}px Segoe UI`;
  if (amb.active) {
    const stages = [];
    for (const j of junctions) {
      if (j.state === 'flushing') stages.push(`J${j.idx+1}: FLUSHING QUEUE`);
      if (j.state === 'green') stages.push(`J${j.idx+1}: GREEN CORRIDOR`);
      if (j.state === 'recovering') stages.push(`J${j.idx+1}: RECOVERING`);
    }
    if (stages.length > 0) {
      ctx.fillText(stages.join('  |  '), W - 15, 25);
    }
  }

  statusEl.textContent = statusText;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function startSim() {
  running = true;
  document.getElementById('btnStart').classList.add('active');
  document.getElementById('btnPause').classList.remove('active');
  loop();
}
function pauseSim() {
  running = false;
  document.getElementById('btnPause').classList.add('active');
  document.getElementById('btnStart').classList.remove('active');
  if (animId) cancelAnimationFrame(animId);
}
function resetSim() {
  pauseSim();
  resizeCanvas();
  initState();
  draw();
  statusEl.textContent = 'Reset — Press Start';
  document.getElementById('btnStart').classList.remove('active');
  document.getElementById('btnPause').classList.remove('active');
}
function setSpeed(s) {
  speed = s;
  document.querySelectorAll('#controls button').forEach(b => {
    if (b.id.startsWith('btnSpeed')) b.classList.remove('active');
  });
  document.getElementById('btnSpeed' + (s === 0.5 ? '05' : s)).classList.add('active');
}

// Initial draw
draw();
</script>
</body>
</html>
