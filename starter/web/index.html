<!doctype html><html lang="en"><head><meta charset="utf-8"><title>AEGIS - local contract lab</title>
<style>body{font:16px system-ui;background:#f3f6fa;color:#152337;max-width:1120px;margin:32px auto;padding:0 20px}h1{font-size:34px}.warning{background:#fff1cd;padding:16px;border-left:5px solid #bb6d00}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}article{background:white;padding:20px;border:1px solid #ced6df;border-radius:8px}button{padding:10px;margin:5px 0;cursor:pointer}pre{background:white;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere}input{padding:10px}small{display:block;margin:12px 0} @media(max-width:700px){#cards{grid-template-columns:1fr 1fr}}</style></head>
<body><h1>AEGIS / Local contract lab</h1><div class="warning"><b>MOCK MODE - DEVELOPMENT FIXTURES</b><br>No CARLA, YOLO or trained MARL is running. Values below are not benchmark results.</div>
<p>Practice the shared data contract without renting a GPU. A failed camera has a null raw count, not zero.</p>
<label>Local operator token <input id="token" value="local-demo-only" type="password"></label>
<button onclick="resetAll()">Reset fixtures</button><span id="msg"></span><div id="cards"></div><h2>Exact API response</h2><pre id="json"></pre>
<script>
async function load(){const s=await(await fetch('/api/v1/snapshot')).json();document.getElementById('json').textContent=JSON.stringify(s,null,2);const box=document.getElementById('cards');box.replaceChildren();s.junctions.forEach(j=>{const card=document.createElement('article');const h=document.createElement('h2');h.textContent=j.junction_id;card.append(h);['camera_status','observed_count','estimated_queue','source'].forEach(k=>{const p=document.createElement('p');p.textContent=k+': '+j[k];card.append(p)});const b=document.createElement('button');b.textContent=j.camera_status==='MISSING'?'Restore camera':'Drop camera';b.onclick=()=>post('/api/v1/faults',{junction_id:j.junction_id,enabled:j.camera_status!=='MISSING'});card.append(b);box.append(card)})}
async function post(path,obj){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+document.getElementById('token').value},body:JSON.stringify(obj)});document.getElementById('msg').textContent=r.ok?' Updated':' Request rejected: '+r.status;await load()}
function resetAll(){post('/api/v1/reset',{})}load();
</script></body></html>
