<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect width="1200" height="780" fill="#F4F7FA"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#163049}.h{font-size:25px;font-weight:bold}.b{font-size:20px}.s{font-size:17px}.panel{fill:white;stroke:#C1CFD9;stroke-width:2}</style><rect x="20" y="20" width="1160" height="72" rx="8" fill="#163049"/><text x="42" y="53" style="fill:white;font-size:26px;font-weight:bold">AEGIS / Operator console</text><text x="42" y="80" style="fill:#D7E7EE;font-size:17px">DESIGN WIREFRAME - mode, run ID, clock lag, checkpoint and health remain visible</text>
<rect class="panel" x="20" y="110" width="700" height="360" rx="8"/><text class="h" x="42" y="146">City overview / selected camera</text><rect x="48" y="174" width="642" height="220" fill="#E8EEF3"/><text class="b" x="195" y="285">Rendered view or labeled network map</text><text class="s" x="45" y="430">Frame ID + simulation timestamp + source + freshness</text>
<rect class="panel" x="740" y="110" width="440" height="360" rx="8"/><text class="h" x="762" y="146">Judge incident controls</text><text class="b" x="762" y="192">1. Select J1 / J2 / J3 / J4</text><text class="b" x="762" y="232">2. Select supported fault</text><text class="b" x="762" y="272">3. Confirm authorized request</text><text class="b" x="762" y="312">4. Applied / rejected / restored</text><text class="s" x="762" y="366">Controls never come from model text</text><text class="s" x="762" y="406">Reset requires a new run and confirmation</text>
<rect class="panel" x="20" y="490" width="275" height="130" rx="8"/><text class="h" x="36" y="524">J1</text><text class="s" x="36" y="553">phase / camera status</text><text class="s" x="36" y="580">observed / estimated / unknown</text><text class="s" x="36" y="606">queue range + observation age</text><rect class="panel" x="315" y="490" width="275" height="130" rx="8"/><text class="h" x="331" y="524">J2</text><text class="s" x="331" y="553">phase / camera status</text><text class="s" x="331" y="580">observed / estimated / unknown</text><text class="s" x="331" y="606">queue range + observation age</text><rect class="panel" x="610" y="490" width="275" height="130" rx="8"/><text class="h" x="626" y="524">J3</text><text class="s" x="626" y="553">phase / camera status</text><text class="s" x="626" y="580">observed / estimated / unknown</text><text class="s" x="626" y="606">queue range + observation age</text><rect class="panel" x="905" y="490" width="275" height="130" rx="8"/><text class="h" x="921" y="524">J4</text><text class="s" x="921" y="553">phase / camera status</text><text class="s" x="921" y="580">observed / estimated / unknown</text><text class="s" x="921" y="606">queue range + observation age</text><rect class="panel" x="20" y="640" width="1160" height="115" rx="8"/><text class="h" x="42" y="678">Inspection drawers</text><text class="b" x="42" y="715">Recovery candidates  |  Ask the city  |  Decision evidence  |  Experiments  |  Replay</text><text class="s" x="42" y="744">Predictions and measured outcomes are separate. Missing results stay blank.</text></svg>