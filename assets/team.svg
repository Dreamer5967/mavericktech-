" y="478" class="b" text-anchor="middle">API, UI, VQA, security</text><text x="825.0" y="506" class="b" text-anchor="middle">Speech and judge console</text><path d="M300,125 L280,200" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><path d="M800,125 L825,200" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><path d="M280,330 L280,410" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><path d="M825,330 L825,410" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="625" width="840" height="110" rx="13" fill="#E1F0EB" stroke="#ADC1CD" stroke-width="2"/><text x="550.0" y="660" class="t" text-anchor="middle">FREQUENT REVIEWED INTEGRATION</text><text x="550.0" y="693" class="b" text-anchor="middle">One deployed revision; parallel work does not mean four clocks.</text><path d="M280,540 L350,625" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><path d="M825,540 L750,625" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/></svg>