<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#557285"/></marker></defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#173348}.t{font-size:25px;font-weight:600}.b{font-size:21px}.l{font-size:19px;fill:#425D70}</style><rect x="40" y="20" width="1020" height="115" rx="13" fill="#E0EDF3" stroke="#ADC1CD" stroke-width="2"/><text x="550.0" y="55" class="t" text-anchor="middle">FOUR LAPTOPS / INDEPENDENT WORK</text><text x="550.0" y="88" class="b" text-anchor="middle">Git branches, local fixtures, editor, slide deck and presentation</text><rect x="320" y="190" width="460" height="90" rx="13" fill="#F1F6F9" stroke="#ADC1CD" stroke-width="2"/><text x="550.0" y="225" class="t" text-anchor="middle">SSH + PRIVATE TUNNEL</text><text x="550.0" y="258" class="b" text-anchor="middle">No public CARLA / TraCI ports</text><path d="M550,135 L550,190" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="335" width="1044" height="305" rx="18" fill="#FAFCFD" stroke="#AAC1CE" stroke-width="2"/><text x="550" y="370" class="t" text-anchor="middle">ONE PAID CLOUD INSTANCE</text><rect x="55" y="405" width="460" height="110" rx="13" fill="#F1F6F9" stroke="#ADC1CD" stroke-width="2"/><text x="285.0" y="440" class="t" text-anchor="middle">LIVE RUNTIME</text><text x="285.0" y="473" class="b" text-anchor="middle">CARLA + SUMO + YOLO</text><text x="285.0" y="501" class="b" text-anchor="middle">Single coordinator + phase checks</text><rect x="585" y="405" width="460" height="110" rx="13" fill="#F1F6F9" stroke="#ADC1CD" stroke-width="2"/><text x="815.0" y="440" class="t" text-anchor="middle">ISOLATED WORKERS</text><text x="815.0" y="473" class="b" text-anchor="middle">Policy training / recovery</text><text x="815.0" y="501" class="b" text-anchor="middle">Scheduled GPU evaluation</text><rect x="270" y="545" width="560" height="75" rx="13" fill="#E1F0EB" stroke="#ADC1CD" stroke-width="2"/><text x="550.0" y="580" class="t" text-anchor="middle">API + FRAME GATEWAY</text><path d="M550,280 L550,335" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><path d="M285,515 L365,545" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><path d="M815,515 L735,545" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="720" width="480" height="120" rx="13" fill="#F1F6F9" stroke="#ADC1CD" stroke-width="2"/><text x="280.0" y="755" class="t" text-anchor="middle">EXTERNAL MODEL / TRACE APIs</text><text x="280.0" y="788" class="b" text-anchor="middle">Separate credentials and quotas</text><text x="280.0" y="816" class="b" text-anchor="middle">Never control the simulation</text><rect x="590" y="720" width="470" height="120" rx="13" fill="#FFF4DF" stroke="#ADC1CD" stroke-width="2"/><text x="825.0" y="755" class="t" text-anchor="middle">LOCAL BACKUP</text><text x="825.0" y="788" class="b" text-anchor="middle">Checkpoints, configs, logs, metrics</text><text x="825.0" y="816" class="b" text-anchor="middle">Verify before cloud destruction</text><path d="M400,640 L280,720" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/><path d="M700,640 L825,720" fill="none" stroke="#557285" stroke-width="3" marker-end="url(#arrow)"/></svg>